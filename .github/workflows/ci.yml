# CI — build + unit/integration tests on every PR and push (spec §12).
# Integration tests spin up a real Postgres via Testcontainers, so the job needs Docker
# (ubuntu-latest provides it). The HS256 JWT_SECRET has no in-source default; surefire injects
# a fake test-only value (see pom.xml), so no CI secrets are required here.
# Security gates (Semgrep, Trivy) and the Docker image build land in later M5 tasks.
name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: ./mvnw -B -ntp verify
