# Production topology (spec §13): Spring app + Postgres + Caddy (auto-Let's-Encrypt reverse proxy).
# The app image bundles the SPA, so the API and thin client are served same-origin; Caddy just
# terminates HTTPS for ${DOMAIN} and proxies everything to the app (WebSocket upgrades pass through
# transparently for M8). Secrets come from a VM-local .env (never committed) — see .env.prod.example.
#
# Bring up on the VM:  docker compose -f compose.prod.yaml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Overridable so deploy.yml can pin an immutable :sha tag; defaults to :latest.
    image: ${APP_IMAGE:-ghcr.io/cs-muic/ssc-y25t3-project-pothello-solo:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8080"          # internal only — reached via Caddy, never published to the host

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persists issued certificates across restarts
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
