# Continuous deployment (spec §12/§13). Runs ONLY after the CI workflow succeeds on main — so the
# Semgrep + Trivy gates actually block a bad build from shipping — then builds & pushes the app
# image to GHCR and pull-and-restarts the stack on the VM over SSH. Flyway migrations run on app
# startup, so restarting the app applies any new migrations.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     — VM public IP or hostname
#   DEPLOY_USER     — non-root deploy user on the VM (in the docker group)
#   DEPLOY_SSH_KEY  — private SSH key whose public half is in that user's authorized_keys
# The VM must already be logged in to GHCR (read-only PAT) so it can pull the private image —
# see the deploy runbook.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push the image to GHCR

env:
  IMAGE: ghcr.io/cs-muic/ssc-y25t3-project-pothello-solo
  # The exact commit CI validated (workflow_run), or the dispatch ref for a manual run.
  DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    # Gate: manual dispatch, OR CI concluded success on the main branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (:sha and :latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the VM (copy compose, pull & restart)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes ${DEPLOY_USER}@${DEPLOY_HOST}"
          # Ship the latest compose + proxy config (secrets stay in the VM-local .env).
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            compose.prod.yaml Caddyfile "${DEPLOY_USER}@${DEPLOY_HOST}:~/othello/"
          # Pin this release by digest-stable :sha tag, pull, recreate, prune old images.
          $SSH "cd ~/othello && \
            export APP_IMAGE='${IMAGE}:${DEPLOY_SHA}' && \
            docker compose -f compose.prod.yaml pull && \
            docker compose -f compose.prod.yaml up -d && \
            docker image prune -f"
