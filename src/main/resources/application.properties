spring.application.name=othello-server

# DataSource (spec §13). Connection coordinates (host/port/db/user) keep local-dev defaults for a
# zero-config `spring-boot:run` against the compose Postgres. The DB password is a secret: it has NO
# in-source default and must come from the environment (DB_PASSWORD) — see .env.example. Integration
# tests ignore all of these; Testcontainers @ServiceConnection supplies the connection.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:othello}
spring.datasource.username=${DB_USER:othello}
spring.datasource.password=${DB_PASSWORD}

# Flyway applies versioned migrations from classpath:db/migration on startup.
spring.flyway.enabled=true

# AI difficulty tuning (spec §7). These are the defaults baked into BotProperties; listed here for
# discoverability. Each tier is a distinct playing character: Easy is a greedy disc-grabber with an
# epsilon chance of a random move, Medium is fixed-depth alpha-beta with a small blunder chance, and
# Hard is depth-capped iterative deepening within a time budget. bot.sync-think-cap clamps Hard's
# budget on any *synchronous* vs-AI reply (creation's bot opening move, and the move-submit reply
# when bot.async-reply is off) so a slow search can't hold the request open.
# bot.easy.epsilon=0.30
# bot.medium.depth=3
# bot.medium.epsilon=0.10
# bot.hard.max-depth=5
# bot.hard.budget=1200ms
# bot.sync-think-cap=1s
# M8: the move-submit AI reply runs on a bounded worker pool and is pushed over WebSocket (default
# true), so the sync cap no longer applies to it and Hard's full budget is used.
# bot.async-reply=true

# JWT (spec §10/§13). The HS256 signing key is a secret: it has NO in-source default and must be
# supplied via the JWT_SECRET environment variable (>=32 bytes). An unset value fails fast at
# startup (unresolved placeholder). Local dev reads it from .env (see .env.example); tests inject it
# via the Surefire plugin. This is what keeps the build free of any committed secret (NoCommittedSecretsTest).
jwt.secret=${JWT_SECRET}
# 24 h access token, no refresh in Core (spec §10 / Appendix C A6).
jwt.access-token-ttl=24h

# Auth is JWT-only (JwtAuthenticationFilter); disable Spring's default form-login user so it stops
# generating a random dev password and registering an in-memory UserDetailsService.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Flyway owns the schema; Hibernate only validates the entity mappings against it (never generates
# or mutates DDL). A mismatch between an entity and V*__*.sql fails startup — caught by tests.
spring.jpa.hibernate.ddl-auto=validate
# No lazy-loading outside the transaction boundary; the service layer loads what it needs (§11).
spring.jpa.open-in-view=false
